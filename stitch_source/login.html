<script>
function togglePasswordVisibility() { 
  const pwdInput = document.getElementById('password-input'); 
  const eyeIcon = document.getElementById('eye-icon'); 
  if (!pwdInput || !eyeIcon) return; 
  if (pwdInput.type === 'password') { 
    pwdInput.type = 'text'; 
    eyeIcon.textContent = 'visibility_off'; 
  } else { 
    pwdInput.type = 'password'; 
    eyeIcon.textContent = 'visibility'; 
  } 
} 

function fillDemoCredentials() { 
  const emailInput = document.getElementById('work-email'); 
  const pwdInput = document.getElementById('password-input'); 
  if (emailInput && pwdInput) { 
    emailInput.value = 'rajesh.mehta@buildguard.ai'; 
    pwdInput.value = 'DirectorPass2025#'; 
    
    // brief subtle highlight animation
    emailInput.classList.add('ring-2', 'ring-primary');
    pwdInput.classList.add('ring-2', 'ring-primary');
    setTimeout(() => {
      emailInput.classList.remove('ring-2', 'ring-primary');
      pwdInput.classList.remove('ring-2', 'ring-primary');
    }, 600);
  } 
} 

function handleGoogleSignIn() {
  const emailInput = document.getElementById('work-email');
  if (emailInput) {
    emailInput.value = 'rajesh.mehta@buildguard.ai';
  }
  handleSignInSubmit();
}

function handleSignInSubmit() { 
  const btn = document.getElementById('submit-btn'); 
  const btnText = document.getElementById('submit-btn-text'); 
  const btnIcon = document.getElementById('submit-btn-icon'); 
  if (!btn) return; 
  btn.disabled = true; 
  if (btnText) btnText.textContent = 'Authenticating site link...'; 
  if (btnIcon) {
    btnIcon.textContent = 'progress_activity'; 
    btnIcon.classList.add('animate-spin'); 
  }
  setTimeout(() => { 
    if (btnText) btnText.textContent = 'Authorized • Entering Site'; 
    if (btnIcon) { 
      btnIcon.classList.remove('animate-spin'); 
      btnIcon.textContent = 'check_circle'; 
    } 
    btn.classList.remove('bg-primary'); 
    btn.classList.add('bg-primary-container'); 
  }, 750); 
}
</script>
